<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台灣鄉鎮區未來人口變化</title>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.142/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <main class="dashboard-grid">
      <section class="panel map-panel">
        <div class="panel-header">
          <h2 id="mapTitle">台灣鄉鎮區未來人口變化</h2>
          <div id="legend" class="legend"></div>
        </div>
        <div id="mapStage" class="map-stage">
          <div id="mapSceneContainer" class="map-scene-container" aria-label="Cesium map"></div>
          <svg id="mapSvg" class="map-overlay map-overlay-hidden" aria-label="Taiwan township overlay">
            <g id="mapViewport">
              <g id="townLayer"></g>
              <g id="countyLayer"></g>
              <g id="insetLayer"></g>
            </g>
          </svg>
          <div id="tooltip" class="tooltip hidden"></div>
          <div id="mapTokenNotice" class="map-token-notice hidden"></div>
        </div>
      </section>

      <section class="panel chart-panel">
        <div class="panel-header chart-header">
          <h2 id="chartTitle">全台未來人口推估(人)</h2>
        </div>
        <div class="chart-wrapper">
          <svg id="chartSvg" class="chart-svg" aria-label="Population projection chart"></svg>
        </div>
        <div id="townSummary" class="town-summary"></div>
      </section>
    </main>

    <section class="control-panel">
      <label class="control-block">
        <span>情境</span>
        <select id="scenarioSelect"></select>
      </label>
      <label class="control-block">
        <span>圖例顏色</span>
        <select id="paletteSelect">
          <option value="rainbow">多色漸層</option>
          <option value="red">紅色漸層</option>
          <option value="blue">藍色漸層</option>
        </select>
      </label>
      <div class="control-block playback-block">
        <span>播放控制</span>
        <div class="playback-actions">
          <button id="playYearsBtn" type="button">播放</button>
          <button id="stopYearsBtn" type="button">停止</button>
        </div>
      </div>
      <div class="control-block timeline-block">
        <div class="timeline-heading">
          <span>年份</span>
          <strong id="yearValue">2025</strong>
        </div>
        <input id="yearRange" type="range" min="0" max="0" step="1" value="0">
        <div id="yearTicks" class="year-ticks"></div>
      </div>
    </section>
  </div>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.142/Build/Cesium/Cesium.js"></script>
  <script src="./app.js" type="module"></script>
</body>
</html>
